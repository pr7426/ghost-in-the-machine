[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-shell"
version = "0.1.0"
description = "A haunted terminal possessed by a local open-weight model (Hacktoberfest 2026 Week 4 — Ghost in the Machine)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Ri Piao", email = "piao981126@gmail.com" },
]
keywords = ["hacktoberfest", "ollama", "cli", "open-source-ai", "ghost-in-the-machine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0.0"]

[project.scripts]
phantom = "phantom_shell.cli:main"
phantom-shell = "phantom_shell.cli:main"

[project.urls]
Homepage = "https://github.com/pr7426/ghost-in-the-machine"
Repository = "https://github.com/pr7426/ghost-in-the-machine"
Issues = "https://github.com/pr7426/ghost-in-the-machine/issues"

[tool.setuptools.packages.find]
include = ["phantom_shell*"]
